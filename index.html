<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代課查詢系統</title>
<style>
  :root{
    --paper:#F6F4EE;
    --ink:#1F2A24;
    --line:#D8D2C2;
    --pine:#2F4B3C;
    --pine-deep:#1E332A;
    --clay:#B4562E;
    --clay-soft:#F0DDCC;
    --free:#3E6B52;
    --free-bg:#E4EEE6;
    --busy:#9A9280;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family: "Noto Serif TC", "PMingLiU", "Songti TC", serif;
    line-height:1.6;
    padding:40px 20px 80px;
  }
  .wrap{max-width:1000px;margin:0 auto;}

  header{
    border-bottom:2px solid var(--pine);
    padding-bottom:18px;
    margin-bottom:34px;
  }
  header .kicker{
    font-family: "Noto Sans TC", sans-serif;
    font-size:13px;
    letter-spacing:0.08em;
    color:var(--clay);
    margin-bottom:6px;
  }
  h1{
    font-size:30px;
    margin:0 0 6px;
    font-weight:700;
    color:var(--pine-deep);
  }
  header p{
    font-family: "Noto Sans TC", sans-serif;
    font-size:14.5px;
    color:#4B5750;
    margin:0;
    max-width:66ch;
  }

  h2.section-title{
    font-family:"Noto Sans TC", sans-serif;
    font-size:16.5px;
    color:var(--pine-deep);
    font-weight:700;
    margin:0 0 16px;
    padding-bottom:10px;
    border-bottom:1px solid var(--line);
  }

  .panel{
    background:#fff;
    border:1px solid var(--line);
    border-radius:2px;
    padding:28px 30px;
    margin-bottom:30px;
  }

  .field-grid{
    display:grid;
    grid-template-columns: 1.3fr 1fr 0.9fr 0.9fr;
    gap:20px;
    align-items:end;
  }
  @media (max-width: 700px){
    .field-grid{grid-template-columns: 1fr 1fr;}
  }
  label{
    display:block;
    font-family:"Noto Sans TC", sans-serif;
    font-size:12.5px;
    color:var(--pine-deep);
    margin-bottom:7px;
    font-weight:600;
  }
  select, input[type=time]{
    width:100%;
    font-family:"Noto Sans TC", sans-serif;
    font-size:15px;
    padding:9px 10px;
    border:1px solid #B7B09D;
    border-radius:2px;
    background:#FDFCF9;
    color:var(--ink);
  }
  select:focus, input:focus{
    outline:2px solid var(--pine);
    outline-offset:1px;
  }

  .btn{
    grid-column: 1 / -1;
    margin-top:6px;
    background:var(--pine);
    color:#fff;
    border:none;
    font-family:"Noto Sans TC", sans-serif;
    font-size:15px;
    font-weight:600;
    padding:13px 18px;
    border-radius:2px;
    cursor:pointer;
    letter-spacing:0.02em;
  }
  .btn:hover{background:var(--pine-deep);}
  .btn:active{transform:translateY(1px);}

  .btn-note{
    grid-column: 1 / -1;
    font-family:"Noto Sans TC", sans-serif;
    font-size:12px;
    color:#8B8474;
    margin-top:-2px;
  }

  #result{display:none;}

  .summary{
    font-family:"Noto Sans TC", sans-serif;
    font-size:14px;
    color:#4B5750;
    margin-bottom:22px;
    padding:14px 18px;
    border-left:3px solid var(--clay);
    background:var(--clay-soft);
  }
  .summary b{color:var(--pine-deep);}

  .period-card{
    border:1px solid var(--line);
    border-radius:2px;
    margin-bottom:16px;
    overflow:hidden;
  }
  .period-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    background:var(--pine-deep);
    color:#F1EEE4;
    padding:10px 18px;
    font-family:"Noto Sans TC", sans-serif;
  }
  .period-head .p-name{font-size:15.5px; font-weight:700; letter-spacing:0.03em;}
  .period-head .p-time{font-size:13px; opacity:0.85;}

  .period-body{padding:16px 18px 18px;}

  .need-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:8px 0;
    border-bottom:1px solid #EFECE1;
    font-family:"Noto Sans TC", sans-serif;
    font-size:14.5px;
  }
  .need-row:last-of-type{border-bottom:none;}
  .tag-class{
    background:var(--clay);
    color:#fff;
    font-size:12px;
    padding:2px 9px;
    border-radius:20px;
    flex-shrink:0;
  }
  .need-row .subject{font-weight:600; color:var(--pine-deep);}
  .need-row .orig{color:#6B6355; font-size:13.5px;}

  .sub-block{
    margin-top:14px;
    padding-top:12px;
    border-top:1px dashed var(--line);
  }
  .sub-label{
    font-family:"Noto Sans TC", sans-serif;
    font-size:12.5px;
    color:#6B6355;
    margin-bottom:8px;
  }
  .chip-row{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    font-family:"Noto Sans TC", sans-serif;
    font-size:13.5px;
    padding:5px 12px;
    border-radius:20px;
    background:var(--free-bg);
    color:var(--free);
    border:1px solid #C7DBCC;
  }
  .chip.none{
    background:#F4EDE9;
    color:var(--busy);
    border:1px solid var(--line);
  }
  .chip.tag-external{
    background:#EFE6D8;
    color:var(--clay);
    border:1px solid #E2CDAE;
    font-size:11.5px;
    padding:2px 8px;
  }

  /* ---- Schedule browser ---- */
  .tabs{
    display:flex;
    gap:8px;
    margin-bottom:18px;
    font-family:"Noto Sans TC", sans-serif;
  }
  .tab-btn{
    border:1px solid var(--line);
    background:#FDFCF9;
    color:#4B5750;
    font-size:14px;
    font-weight:600;
    padding:9px 20px;
    border-radius:20px;
    cursor:pointer;
  }
  .tab-btn.active{
    background:var(--pine);
    border-color:var(--pine);
    color:#fff;
  }

  .view-controls{
    display:flex;
    align-items:end;
    gap:20px;
    margin-bottom:22px;
  }
  .view-controls > div{min-width:220px;}

  table.schedule-table{
    width:100%;
    border-collapse:collapse;
    font-family:"Noto Sans TC", sans-serif;
    table-layout:fixed;
  }
  table.schedule-table th, table.schedule-table td{
    border:1px solid var(--line);
    padding:0;
    text-align:center;
    vertical-align:middle;
  }
  table.schedule-table thead th{
    background:var(--pine-deep);
    color:#F1EEE4;
    font-size:13.5px;
    padding:10px 4px;
    font-weight:700;
  }
  table.schedule-table thead th.period-col{
    background:var(--pine-deep);
  }
  table.schedule-table tbody th{
    background:#FBF9F3;
    color:var(--pine-deep);
    font-size:12.5px;
    padding:8px 4px;
    font-weight:700;
    width:88px;
  }
  table.schedule-table tbody th .p-sub{
    display:block;
    font-weight:400;
    color:#8B8474;
    font-size:11px;
    margin-top:2px;
  }
  .cell-slot{
    height:64px;
    padding:6px 4px;
    cursor:pointer;
    transition:background 0.12s;
  }
  .cell-slot:hover{background:var(--clay-soft);}
  .cell-slot .cell-subject{
    font-size:13.5px;
    font-weight:700;
    color:var(--pine-deep);
    display:block;
  }
  .cell-slot .cell-sub2{
    font-size:11.5px;
    color:#6B6355;
    display:block;
    margin-top:3px;
  }
  .cell-slot.is-empty{
    cursor:default;
    color:#B7AF9C;
    font-size:12px;
  }
  .cell-slot.is-empty:hover{background:none;}

  /* Modal */
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(31,42,36,0.45);
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    background:#fff;
    max-width:480px;
    width:100%;
    border-radius:3px;
    border:1px solid var(--line);
    padding:26px 26px 22px;
    position:relative;
    font-family:"Noto Sans TC", sans-serif;
  }
  .modal-close{
    position:absolute;
    top:14px; right:16px;
    background:none;
    border:none;
    font-size:18px;
    color:#8B8474;
    cursor:pointer;
    line-height:1;
  }
  .modal-close:hover{color:var(--pine-deep);}
  .modal-title{
    font-family:"Noto Serif TC", serif;
    font-size:19px;
    font-weight:700;
    color:var(--pine-deep);
    margin:0 0 4px;
  }
  .modal-subtitle{
    font-size:13px;
    color:#8B8474;
    margin-bottom:18px;
  }
  .modal-info-row{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:14.5px;
    margin-bottom:6px;
  }
  .modal-info-row .label{color:#6B6355; font-size:12.5px; flex-shrink:0; width:64px;}

  .empty-msg{
    font-family:"Noto Sans TC", sans-serif;
    font-size:15px;
    color:#4B5750;
    padding:18px;
    border:1px dashed var(--line);
    text-align:center;
  }

  footer{
    margin-top:40px;
    font-family:"Noto Sans TC", sans-serif;
    font-size:12px;
    color:#8B8474;
    text-align:center;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="kicker">校務行政・代課安排</div>
    <h1>代課查詢系統</h1>
    <p>輸入請假教師與請假時段，系統會依 115 學年度排課表列出需要代課的節次；也可以直接瀏覽班級或老師的完整課表，點選任一節課即可看到該節可安排代課的老師選項。</p>
  </header>

  <div class="panel">
    <h2 class="section-title">依請假時段查詢</h2>
    <div class="field-grid">
      <div>
        <label for="teacher">請假教師</label>
        <select id="teacher"></select>
      </div>
      <div>
        <label for="day">請假星期</label>
        <select id="day">
          <option value="一">星期一</option>
          <option value="二">星期二</option>
          <option value="三">星期三</option>
          <option value="四">星期四</option>
          <option value="五">星期五</option>
        </select>
      </div>
      <div>
        <label for="start">請假起</label>
        <input type="time" id="start" value="08:30">
      </div>
      <div>
        <label for="end">請假迄</label>
        <input type="time" id="end" value="12:00">
      </div>
      <button class="btn" onclick="runQuery()">查詢代課需求</button>
      <div class="btn-note">＊修改任一欄位（尤其是「請假迄」）後會自動更新結果，此按鈕僅供手動重新查詢使用。</div>
    </div>
  </div>

  <div id="result" class="panel">
    <div class="summary" id="summaryBox"></div>
    <div id="cards"></div>
  </div>

  <div class="panel">
    <h2 class="section-title">完整課表瀏覽</h2>
    <div class="tabs">
      <button class="tab-btn active" id="tabClassBtn" onclick="switchTab('class')">依班級</button>
      <button class="tab-btn" id="tabTeacherBtn" onclick="switchTab('teacher')">依老師</button>
    </div>
    <div class="view-controls">
      <div id="classPicker">
        <label for="classSelect">選擇班級</label>
        <select id="classSelect"></select>
      </div>
      <div id="teacherPicker" style="display:none;">
        <label for="teacherSelect2">選擇老師</label>
        <select id="teacherSelect2"></select>
      </div>
    </div>
    <div id="scheduleTableWrap"></div>
    <div class="btn-note" style="margin-top:14px;">＊點選表格中任一節課，即可看到當節可安排代課的老師選項。</div>
  </div>

  <footer>資料來源：115排課表（07:30~08:30 早自習、12:00~12:55 午休、第1~7節）。如遇聯課、社團、技藝班等混班課程，請另行確認實際帶班教師。</footer>
</div>

<div class="modal-overlay" id="cellModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

const DAYS = ['一','二','三','四','五'];
const DAY_LABEL = {'一':'星期一','二':'星期二','三':'星期三','四':'星期四','五':'星期五'};
const CLASSES = ['國一','國二','國三'];

const teacherSelect = document.getElementById('teacher');
DATA.teachers.forEach(t => {
  const opt = document.createElement('option');
  opt.value = t; opt.textContent = t;
  teacherSelect.appendChild(opt);
});

function toMinutes(hhmm){
  const [h,m] = hhmm.split(':').map(Number);
  return h*60+m;
}

function overlaps(aStart,aEnd,bStart,bEnd){
  return aStart < bEnd && bStart < aEnd;
}

/* ---------- 依請假時段查詢 ---------- */
function runQuery(){
  const teacher = teacherSelect.value;
  const day = document.getElementById('day').value;
  const start = document.getElementById('start').value;
  const end = document.getElementById('end').value;

  const resultBox = document.getElementById('result');
  const summaryBox = document.getElementById('summaryBox');
  const cardsBox = document.getElementById('cards');
  cardsBox.innerHTML = '';
  resultBox.style.display = 'block';

  if(!start || !end || toMinutes(end) <= toMinutes(start)){
    summaryBox.innerHTML = '請確認請假迄時間須晚於請假起時間。';
    return;
  }

  const reqStart = toMinutes(start);
  const reqEnd = toMinutes(end);
  const dayLabel = DAY_LABEL[day];
  const affected = [];

  DATA.periods.forEach(p => {
    const pStart = toMinutes(p.start);
    const pEnd = toMinutes(p.end);
    if(!overlaps(reqStart, reqEnd, pStart, pEnd)) return;

    const entries = DATA.schedule[day][String(p.period)];
    const needs = entries.filter(e => e.teachers.some(t => t.name === teacher));
    if(needs.length === 0) return;

    const busy = new Set();
    entries.forEach(e => e.teachers.forEach(t => busy.add(t.name)));
    const free = DATA.teachers.filter(t => t !== teacher && !busy.has(t));

    affected.push({period: p, needs, free});
  });

  if(affected.length === 0){
    summaryBox.innerHTML = `<b>${teacher}</b> 老師於 ${dayLabel} ${start}~${end} 這段時間沒有排課，不需要安排代課。`;
    cardsBox.innerHTML = '';
    return;
  }

  const totalNeeds = affected.reduce((sum,a) => sum + a.needs.length, 0);
  summaryBox.innerHTML = `<b>${teacher}</b> 老師請假時段：${dayLabel} ${start}~${end}，共影響 <b>${affected.length}</b> 節、<b>${totalNeeds}</b> 個班級課程，需要安排代課。`;

  affected.forEach(a => {
    const card = document.createElement('div');
    card.className = 'period-card';

    const head = document.createElement('div');
    head.className = 'period-head';
    head.innerHTML = `<span class="p-name">第${a.period.period}節</span><span class="p-time">${a.period.start}～${a.period.end}</span>`;
    card.appendChild(head);

    const body = document.createElement('div');
    body.className = 'period-body';

    a.needs.forEach(n => {
      const row = document.createElement('div');
      row.className = 'need-row';
      row.innerHTML = `<span class="tag-class">${n.class}</span><span class="subject">${n.subject}</span><span class="orig">原授課：${teacher}</span>`;
      body.appendChild(row);
    });

    const subBlock = document.createElement('div');
    subBlock.className = 'sub-block';
    const subLabel = document.createElement('div');
    subLabel.className = 'sub-label';
    subLabel.textContent = '本節可代課教師（該節無課）';
    subBlock.appendChild(subLabel);

    const chipRow = document.createElement('div');
    chipRow.className = 'chip-row';
    if(a.free.length === 0){
      const chip = document.createElement('span');
      chip.className = 'chip none';
      chip.textContent = '本節全體教師皆有課，請考慮跨節調課或行政支援';
      chipRow.appendChild(chip);
    } else {
      a.free.forEach(name => {
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.textContent = name;
        chipRow.appendChild(chip);
      });
    }
    subBlock.appendChild(chipRow);
    body.appendChild(subBlock);

    card.appendChild(body);
    cardsBox.appendChild(card);
  });
}

['teacher','day','start','end'].forEach(id => {
  document.getElementById(id).addEventListener('change', runQuery);
});

/* ---------- 完整課表瀏覽 ---------- */
let currentTab = 'class';

const classSelect = document.getElementById('classSelect');
CLASSES.forEach(c => {
  const opt = document.createElement('option');
  opt.value = c; opt.textContent = c;
  classSelect.appendChild(opt);
});

const teacherSelect2 = document.getElementById('teacherSelect2');
DATA.teachers.forEach(t => {
  const opt = document.createElement('option');
  opt.value = t; opt.textContent = t;
  teacherSelect2.appendChild(opt);
});

function switchTab(tab){
  currentTab = tab;
  document.getElementById('tabClassBtn').classList.toggle('active', tab === 'class');
  document.getElementById('tabTeacherBtn').classList.toggle('active', tab === 'teacher');
  document.getElementById('classPicker').style.display = tab === 'class' ? 'block' : 'none';
  document.getElementById('teacherPicker').style.display = tab === 'teacher' ? 'block' : 'none';
  renderScheduleTable();
}

classSelect.addEventListener('change', renderScheduleTable);
teacherSelect2.addEventListener('change', renderScheduleTable);

function getCellForClass(day, period, className){
  const entries = DATA.schedule[day][String(period)];
  return entries.find(e => e.class === className) || null;
}
function getCellForTeacher(day, period, teacherName){
  const entries = DATA.schedule[day][String(period)];
  return entries.find(e => e.teachers.some(t => t.name === teacherName)) || null;
}

function renderScheduleTable(){
  const wrap = document.getElementById('scheduleTableWrap');
  const table = document.createElement('table');
  table.className = 'schedule-table';

  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');
  const cornerTh = document.createElement('th');
  cornerTh.className = 'period-col';
  cornerTh.textContent = '節次';
  headRow.appendChild(cornerTh);
  DAYS.forEach(d => {
    const th = document.createElement('th');
    th.textContent = DAY_LABEL[d];
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');

  DATA.periods.forEach(p => {
    const tr = document.createElement('tr');
    const th = document.createElement('th');
    th.innerHTML = `第${p.period}節<span class="p-sub">${p.start}~${p.end}</span>`;
    tr.appendChild(th);

    DAYS.forEach(d => {
      const td = document.createElement('td');
      const entry = currentTab === 'class'
        ? getCellForClass(d, p.period, classSelect.value)
        : getCellForTeacher(d, p.period, teacherSelect2.value);

      const slot = document.createElement('div');

      if(!entry){
        slot.className = 'cell-slot is-empty';
        slot.textContent = currentTab === 'teacher' ? '空堂' : '—';
      } else {
        slot.className = 'cell-slot';
        if(currentTab === 'class'){
          const teacherNames = entry.teachers.map(t => t.name).join('、');
          slot.innerHTML = `<span class="cell-subject">${entry.subject}</span><span class="cell-sub2">${teacherNames}</span>`;
        } else {
          slot.innerHTML = `<span class="cell-subject">${entry.class}</span><span class="cell-sub2">${entry.subject}</span>`;
        }
        slot.addEventListener('click', () => openCellModal(d, p, entry));
      }
      td.appendChild(slot);
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  wrap.innerHTML = '';
  wrap.appendChild(table);
}

function openCellModal(day, period, entry){
  const busy = new Set();
  const entries = DATA.schedule[day][String(period.period)];
  entries.forEach(e => e.teachers.forEach(t => busy.add(t.name)));
  const free = DATA.teachers.filter(t => !busy.has(t));

  const teacherChips = entry.teachers.map(t => {
    return `<span class="chip" style="background:var(--clay-soft); color:var(--clay); border-color:#E2CDAE;">${t.name}${t.external ? '<span class="chip tag-external" style="margin-left:4px;">外聘</span>' : ''}</span>`;
  }).join(' ');

  let freeHtml;
  if(free.length === 0){
    freeHtml = `<span class="chip none">本節全體教師皆有課，請考慮跨節調課或行政支援</span>`;
  } else {
    freeHtml = free.map(name => `<span class="chip">${name}</span>`).join('');
  }

  const modalContent = document.getElementById('modalContent');
  modalContent.innerHTML = `
    <div class="modal-title">${DAY_LABEL[day]}・第${period.period}節</div>
    <div class="modal-subtitle">${period.start}～${period.end}</div>
    <div class="modal-info-row"><span class="label">班級</span><span class="tag-class">${entry.class}</span></div>
    <div class="modal-info-row"><span class="label">科目</span>${entry.subject}</div>
    <div class="modal-info-row" style="align-items:flex-start;"><span class="label">原授課</span><span class="chip-row">${teacherChips}</span></div>
    <div class="sub-block">
      <div class="sub-label">本節可代課教師（該節無課）</div>
      <div class="chip-row">${freeHtml}</div>
    </div>
  `;
  document.getElementById('cellModal').classList.add('open');
}

function closeModal(){
  document.getElementById('cellModal').classList.remove('open');
}
document.getElementById('cellModal').addEventListener('click', (e) => {
  if(e.target.id === 'cellModal') closeModal();
});

renderScheduleTable();
</script>
